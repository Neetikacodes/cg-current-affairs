<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG परिपत्र — छत्तीसगढ़ करेंट अफेयर्स</title>
<style>
  :root{
    --bg: #0f2318;
    --panel: #15301f;
    --paper: #f6efe0;
    --ochre: #c17a37;
    --ochre-bright: #e0983f;
    --line: rgba(246,239,224,0.14);
    --muted: rgba(246,239,224,0.58);
    --sarguja: #8a3b2b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% 0%, rgba(224,152,63,0.08), transparent 55%),
      var(--bg);
    color: var(--paper);
    font-family: 'Noto Sans Devanagari','Noto Sans',Georgia,serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}
  header{
    padding:46px 20px 30px;
    border-bottom:1px solid var(--line);
    max-width:760px;margin:0 auto;
  }
  h1{font-size:40px; line-height:1.15; margin:0 0 10px; font-weight:700; letter-spacing:-.01em;}
  h1 span{color:var(--ochre-bright);}
  .meta-row{margin-top:22px; display:flex; gap:22px; flex-wrap:wrap; font-family:'Noto Sans',sans-serif; font-size:12px; color:var(--muted);}
  .meta-row b{color:var(--paper); font-weight:600;}
  .log{margin-top:10px;}
  .entry{position:relative; padding:34px 0 34px 34px; border-left:1px solid var(--line); margin-left:6px;}
  .entry:last-child{border-left:1px solid transparent;}
  .entry::before{content:""; position:absolute; left:-6px; top:38px; width:11px; height:11px; border-radius:50%; background:var(--ochre-bright); box-shadow:0 0 0 4px var(--bg), 0 0 0 5px var(--line);}
  .date-tag{font-family:'Noto Sans',sans-serif; font-weight:700; font-size:13px; letter-spacing:.06em; color:var(--ochre-bright); text-transform:uppercase; margin-bottom:14px;}
  .date-tag .day{color:var(--muted); font-weight:400; margin-left:8px; text-transform:none; letter-spacing:0;}
  .card{background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px;}
  .card h3{margin:0 0 8px; font-size:16.5px; line-height:1.4; font-weight:700; color:var(--paper);}
  .card h3 .tag{font-family:'Noto Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--bg); background:var(--ochre-bright); padding:2px 8px; border-radius:20px; vertical-align:middle; margin-right:8px;}
  .card p{margin:0; font-size:14.5px; line-height:1.75; color: rgba(246,239,224,0.86);}
  .card .src{
    margin-top:10px; padding-top:8px;
    font-family:'Noto Sans',sans-serif; font-size:11.5px; color:var(--muted);
  }
  .card .src:first-of-type{border-top:1px solid var(--line);}
  .card .src a{color:var(--ochre-bright); text-decoration:none;}
  .card .src a:hover{text-decoration:underline;}
  .card.multi{cursor:pointer; transition:border-color .15s;}
  .card.multi:hover, .card.multi:focus-visible{border-color:rgba(224,152,63,.55); outline:none;}
  .card .more{
    margin-top:12px; padding-top:9px; border-top:1px solid var(--line);
    font-family:'Noto Sans',sans-serif; font-size:12px; font-weight:600; color:var(--ochre-bright);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .card .more .arrow{transition:transform .2s; display:inline-block;}
  .card.open .more .arrow{transform:rotate(180deg);}
  .card .srclist{display:none; margin-top:6px; font-family:'Noto Sans',sans-serif; font-size:13px;}
  .card.open .srclist{display:block;}
  .card .srclist a{display:block; padding:8px 0; border-top:1px dashed var(--line); color:var(--ochre-bright); text-decoration:none;}
  .card .srclist a:hover{text-decoration:underline;}
  .loading, .error{font-family:'Noto Sans',sans-serif; color:var(--muted); padding:40px 0;}
  @media (max-width:600px){
    h1{font-size:30px;}
    header{padding:34px 16px 24px;}
    .entry{padding-left:24px; margin-left:2px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CG परिपत्र<br><span>छत्तीसगढ़ करेंट अफेयर्स</span></h1>
    <div class="meta-row">
      <div>अंतिम अपडेट: <b id="lastUpdate">—</b></div>
      <div>कुल एंट्री: <b id="entryCount">—</b></div>
      <div>स्रोत: <b>PIB + प्रमुख हिंदी/अंग्रेज़ी समाचार पत्र</b></div>
    </div>
  </header>

  <div class="wrap" style="padding-top:8px;">
    <div class="log" id="log"><div class="loading">लोड हो रहा है…</div></div>
  </div>
</div>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';

function buildCard(it) {
  const card = document.createElement('div');
  card.className = 'card';

  // Naye data me `sources` (sabhi akhbaar), purane data me sirf source/source_url
  const srcs = (it.sources && it.sources.length)
    ? it.sources
    : (it.source_url ? [{ name: it.source || 'आधिकारिक स्रोत', url: it.source_url }] : []);
  const multi = srcs.length > 1;

  let footer = '';
  if (multi) {
    footer = `
      <div class="more"><span>📰 ${srcs.length} समाचार स्रोतों में छपी — लिंक देखें</span><span class="arrow">▾</span></div>
      <div class="srclist">${srcs.map(s => `<a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${esc(s.name)} में पढ़ें ↗</a>`).join('')}</div>`;
  } else if (srcs.length === 1) {
    footer = `<div class="src">स्रोत: <a href="${safeUrl(srcs[0].url)}" target="_blank" rel="noopener">${esc(srcs[0].name)}</a></div>`;
  }
  const paperLine = it.newspaper_url
    ? `<div class="src">अख़बार में भी पढ़ें: <a href="${safeUrl(it.newspaper_url)}" target="_blank" rel="noopener">${esc(it.newspaper || 'लिंक')}</a></div>`
    : '';

  card.innerHTML = `<h3><span class="tag">${esc(it.tag)}</span>${esc(it.title)}</h3><p>${esc(it.body)}</p>${footer}${paperLine}`;

  if (multi) {
    card.classList.add('multi');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-expanded', 'false');
    const toggle = () => {
      const open = card.classList.toggle('open');
      card.setAttribute('aria-expanded', String(open));
    };
    card.addEventListener('click', e => { if (!e.target.closest('a')) toggle(); });
    card.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); toggle(); }
    });
  }
  return card;
}

fetch('./data.json?t=' + Date.now())
  .then(r => {
    if (!r.ok) throw new Error('data.json load failed: ' + r.status);
    return r.json();
  })
  .then(entries => {
    entries.sort((a, b) => (a.iso_date < b.iso_date ? 1 : -1));
    const log = document.getElementById('log');
    log.innerHTML = '';
    let count = 0;
    entries.forEach(e => {
      const entryEl = document.createElement('div');
      entryEl.className = 'entry';
      const dateTag = document.createElement('div');
      dateTag.className = 'date-tag';
      dateTag.innerHTML = esc(e.date) + (e.day && e.day !== '—' ? `<span class="day">${esc(e.day)}</span>` : '');
      entryEl.appendChild(dateTag);
      (e.items || []).forEach(it => {
        count++;
        entryEl.appendChild(buildCard(it));
      });
      log.appendChild(entryEl);
    });
    document.getElementById('entryCount').textContent = count;
    document.getElementById('lastUpdate').textContent = entries.length ? entries[0].date : '—';
  })
  .catch(err => {
    document.getElementById('log').innerHTML =
      '<div class="error">डेटा लोड नहीं हो पाया: ' + esc(err.message) + '</div>';
  });
</script>
</body>
</html>
